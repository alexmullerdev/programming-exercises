<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./calculostyle.css">
</head>
<body>
    <form>
        <label>Valor A</label><input type="number" id="v1">
        <label>Valor B</label><input type="number" id="v2">
        <label>Operação</label>
        <select id="oper">
            <option>Soma</option> <option>Subtração</option>
            <option>Multiplicação</option> <option>Divisão</option>
            <option>Potência</option>
        </select>
        <a href="#" onclick="executar()">executar</a>
    </form>
    <div id="resp">Resultado:</div>
    <script src="./operacoes.js"></script>
    <script>
        const executar = () => {
            const a = Number(document.getElementById("v1").value);
            const b = Number(document.getElementById("v2").value);
            let oper = eval(document.getElementById("oper").selectedIndex);
            let resultado = (oper ==0)?somar(a,b): (oper==1)?subtrair(a,b):
             (oper==2)?multiplicar(a,b): (oper==3)?dividir(a,b): (oper==4)?exponencial(a,b):null;
            document.getElementById("resp").innerHTML =
            `O resultado da operação é ${resultado}`;
            console.log `${a}`;
            console.log `${b}`;
            console.log `${resultado}`;
        }
    </script>
    
</body>
</html>
